name: CompanyOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 Unit, SHACL Merge & Procedure Memory Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run pytest with coverage gate (>=95% on SHACL & Procedure Memory)
        run: pytest test_companyos.py -v --cov=company_os --cov-report=term-missing
